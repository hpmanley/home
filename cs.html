	.coming-soon {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(circle at top right,
        rgba(139,92,246,.25),
        transparent 40%),
        #020617;

    color: white;
    padding: 2rem;
}

.coming-soon-content {
    max-width: 800px;
}

.logo {
    font-size: 2rem;
    font-weight: 800;
    color: #8b5cf6;
    margin-bottom: 2rem;
}

.coming-soon h1 {
    font-size: clamp(3rem, 8vw, 6rem);
    margin-bottom: 1rem;
}

.subtitle {
    color: #cbd5e1;
    font-size: 1.2rem;
    line-height: 1.8;
    margin-bottom: 2.5rem;
}

.status-card {
    display: inline-flex;
    align-items: center;
    gap: 12px;

    background: rgba(255,255,255,.05);
    border: 1px solid rgba(139,92,246,.3);

    padding: 15px 25px;
    border-radius: 50px;

    margin-bottom: 3rem;
}

.pulse {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #B81D13;

    box-shadow: 0 0 20px #8b5cf6;

    animation: pulse 1.0s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 3rem;
    flex-wrap: wrap;
}

.time-box {
    width: 120px;
    padding: 25px;

    background: rgba(255,255,255,.04);

    border: 1px solid rgba(139,92,246,.25);
    border-radius: 20px;

    backdrop-filter: blur(10px);
}

.time-box h2 {
    color: #8b5cf6;
    font-size: 2rem;
}

.btn {
    display: inline-block;

    padding: 16px 40px;

    border-radius: 12px;

    background: #8b5cf6;
    color: white;

    text-decoration: none;
    font-weight: 600;

    box-shadow: 0 0 30px rgba(139,92,246,.5);

    transition: .3s;
}

.btn:hover {
    transform: translateY(-3px);
}
